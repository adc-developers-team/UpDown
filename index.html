<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UpDown Chat</title>
    <style>
      #splash {
        position: fixed; inset: 0; background: #0f172a; display: flex;
        align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #splash img {
        width: 100px; height: 100px;
        animation: splash-pulse 1.5s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/favicon.svg" alt="UpDown" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', () => {
        const splash = document.getElementById('splash');
        if (splash) splash.style.opacity = '0';
        setTimeout(() => { if (splash) splash.style.display = 'none'; }, 300);
      });
    </script>
  </body>
</html>
