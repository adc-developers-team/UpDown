<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded square background with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" />
  
  <!-- Chat bubble (speech bubble with tail) -->
  <path d="M14 18a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H32l-8 6v-6h-6a4 4 0 0 1-4-4V18z" 
        fill="white" />
  
  <!-- Three dots inside the bubble -->
  <circle cx="26" cy="30" r="2.5" fill="#1e3a5f" />
  <circle cx="32" cy="30" r="2.5" fill="#1e3a5f" />
  <circle cx="38" cy="30" r="2.5" fill="#1e3a5f" />
  
  <!-- Small phone/vibrate icon -->
